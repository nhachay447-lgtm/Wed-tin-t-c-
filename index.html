<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng bài - TinTuc24h</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,sans-serif; }
  body { background:#f4f6f8; color:#222; }

  header {
    background:linear-gradient(135deg,#e63946,#c1121f);
    color:#fff; padding:14px 0;
    box-shadow:0 2px 12px rgba(0,0,0,.15);
  }
  .container { max-width:900px; margin:0 auto; padding:0 16px; }
  .header-top { display:flex; align-items:center; justify-content:space-between; }
  .logo { font-size:22px; font-weight:800; cursor:pointer; }
  .logo span { color:#ffe066; }
  .back-btn {
    background:rgba(255,255,255,.2); color:#fff; border:none;
    padding:8px 16px; border-radius:20px; cursor:pointer; font-size:14px; font-weight:600;
  }
  .back-btn:hover { background:rgba(255,255,255,.35); }

  main { padding:30px 0; }
  .form-card {
    background:#fff; border-radius:16px; padding:30px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
  }
  .form-card h1 { font-size:24px; margin-bottom:6px; color:#c1121f; }
  .form-card p.sub { color:#888; font-size:14px; margin-bottom:24px; }

  .form-group { margin-bottom:18px; }
  label { display:block; font-weight:600; margin-bottom:8px; font-size:14px; }
  label .req { color:#e63946; }
  input[type="text"], select, textarea {
    width:100%; padding:12px 14px; border:2px solid #e5e7eb;
    border-radius:10px; font-size:14px; outline:none; transition:.2s;
    font-family:inherit;
  }
  input:focus, select:focus, textarea:focus { border-color:#e63946; }
  textarea { resize:vertical; min-height:220px; line-height:1.6; }

  .img-preview {
    margin-top:10px; border-radius:10px; overflow:hidden;
    max-height:200px; display:none;
  }
  .img-preview img { width:100%; height:200px; object-fit:cover; }

  .hint { font-size:12px; color:#888; margin-top:6px; }

  .form-actions { display:flex; gap:12px; margin-top:26px; }
  .btn {
    padding:13px 24px; border:none; border-radius:10px;
    font-weight:700; cursor:pointer; font-size:15px; transition:.2s;
  }
  .btn-primary { background:linear-gradient(135deg,#e63946,#c1121f); color:#fff; flex:2; }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(230,57,70,.3); }
  .btn-cancel { background:#e5e7eb; color:#444; flex:1; }
  .btn-cancel:hover { background:#d1d5db; }

  .toast {
    position:fixed; top:20px; right:20px; background:#10b981; color:#fff;
    padding:14px 22px; border-radius:10px; font-weight:600;
    transform:translateX(400px); transition:.3s; z-index:1000;
    box-shadow:0 4px 16px rgba(0,0,0,.15);
  }
  .toast.show { transform:translateX(0); }
  .toast.error { background:#e63946; }
</style>
</head>
<body>

<header>
  <div class="container">
    <div class="header-top">
      <div class="logo" onclick="location.href='index.html'">TinTuc<span>24h</span></div>
      <button class="back-btn" onclick="location.href='index.html'">← Về trang chủ</button>
    </div>
  </div>
</header>

<main class="container">
  <div class="form-card">
    <h1 id="formTitle">✍️ Viết bài mới</h1>
    <p class="sub">Điền thông tin bên dưới để đăng bài viết lên trang chủ</p>

    <div class="form-group">
      <label>Tiêu đề bài viết <span class="req">*</span></label>
      <input type="text" id="title" placeholder="VD: Bão số 5 đổ bộ vào miền Trung...">
    </div>

    <div class="form-group">
      <label>Danh mục <span class="req">*</span></label>
      <select id="category">
        <option value="Thời sự">Thời sự</option>
        <option value="Công nghệ">Công nghệ</option>
        <option value="Kinh tế">Kinh tế</option>
        <option value="Thể thao">Thể thao</option>
        <option value="Giải trí">Giải trí</option>
        <option value="Sức khỏe">Sức khỏe</option>
        <option value="Giáo dục">Giáo dục</option>
      </select>
    </div>

    <div class="form-group">
      <label>Người viết</label>
      <input type="text" id="author" placeholder="Tên của bạn..." value="Admin">
    </div>

    <div class="form-group">
      <label>Link ảnh minh họa (tùy chọn)</label>
      <input type="text" id="imageUrl" placeholder="https://...">
      <div class="hint">💡 Để trống sẽ dùng ảnh ngẫu nhiên. Hoặc chọn ảnh từ máy bên dưới.</div>
      <input type="file" id="imageFile" accept="image/*" style="margin-top:10px;">
      <div class="img-preview" id="imgPreview"><img id="previewImg"></div>
    </div>

    <div class="form-group">
      <label>Nội dung bài viết <span class="req">*</span></label>
      <textarea id="content" placeholder="Nhập nội dung bài viết ở đây..."></textarea>
    </div>

    <div class="form-actions">
      <button class="btn btn-cancel" onclick="location.href='index.html'">Hủy</button>
      <button class="btn btn-primary" onclick="savePost()">🚀 Đăng bài</button>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  const urlParams = new URLSearchParams(location.search);
  const editId = urlParams.get('id');
  let editingPost = null;

  // Nếu đang sửa
  if (editId) {
    const news = JSON.parse(localStorage.getItem('news_list') || '[]');
    editingPost = news.find(n => n.id == editId);
    if (editingPost) {
      document.getElementById('formTitle').textContent = '✏️ Sửa bài viết';
      document.getElementById('title').value = editingPost.title;
      document.getElementById('category').value = editingPost.cat;
      document.getElementById('author').value = editingPost.author || 'Admin';
      document.getElementById('content').value = editingPost.content || '';
      if (editingPost.img) {
        document.getElementById('imageUrl').value = editingPost.img;
        document.getElementById('previewImg').src = editingPost.img;
        document.getElementById('imgPreview').style.display = 'block';
      }
    }
  }

  // Preview ảnh từ URL
  document.getElementById('imageUrl').addEventListener('input', e => {
    const url = e.target.value.trim();
    const preview = document.getElementById('imgPreview');
    if (url) {
      document.getElementById('previewImg').src = url;
      preview.style.display = 'block';
    } else {
      preview.style.display = 'none';
    }
  });

  // Upload ảnh từ máy → chuyển thành base64
  let base64Image = null;
  document.getElementById('imageFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) {
      alert('Ảnh quá lớn! Vui lòng chọn ảnh dưới 2MB.');
      return;
    }
    const reader = new FileReader();
    reader.onload = ev => {
      base64Image = ev.target.result;
      document.getElementById('previewImg').src = base64Image;
      document.getElementById('imgPreview').style.display = 'block';
      document.getElementById('imageUrl').value = '';
    };
    reader.readAsDataURL(file);
  });

  // Lưu bài
  function savePost() {
    const title = document.getElementById('title').value.trim();
    const cat = document.getElementById('category').value;
    const author = document.getElementById('author').value.trim() || 'Ẩn danh';
    const content = document.getElementById('content').value.trim();
    const imgUrl = document.getElementById('imageUrl').value.trim();

    if (!title) return showToast('Vui lòng nhập tiêu đề!', true);
    if (!content) return showToast('Vui lòng nhập nội dung!', true);

    let news = JSON.parse(localStorage.getItem('news_list') || '[]');
    const img = base64Image || imgUrl || '';

    if (editingPost) {
      // Cập nhật
      const idx = news.findIndex(n => n.id == editingPost.id);
      news[idx] = { ...news[idx], title, cat, author, content, img: img || news[idx].img };
      localStorage.setItem('news_list', JSON.stringify(news));
      showToast('Cập nhật thành công!');
    } else {
      // Tạo mới
      const newPost = {
        id: Date.now(),
        title, cat, author, content,
        img: img || `https://picsum.photos/seed/${Date.now()}/600/400`,
        time: 'Vừa xong',
        views: 0
      };
      news.unshift(newPost);
      localStorage.setItem('news_list', JSON.stringify(news));
      showToast('Đăng bài thành công!');
    }

    setTimeout(() => location.href = 'index.html', 1200);
  }

  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = (isError ? '⚠️ ' : '✅ ') + msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => t.className = 'toast' + (isError ? ' error' : ''), 2500);
  }
</script>
</body>
  </html>
